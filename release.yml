name: Release

# Выпуск версии:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (версия берётся из тега)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn -B -ntp -Drevision="$VERSION" clean package
          mkdir dist
          cp "target/PyBridge-$VERSION.jar" dist/PyBridge.jar
          cp python/pybridge/__init__.py dist/pybridge.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PyBridge.jar
            dist/pybridge.py
          generate_release_notes: true
